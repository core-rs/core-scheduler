[package]
name = "core-scheduler-native"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/core-rs/core-scheduler"
description = "Native work-stealing scheduler with readiness I/O and batched timers"
readme = "readme.md"

[dependencies]
core-scheduler = { path = "../..", version = "=0.0.0" }
event-listener = "5.4.2"
futures-channel = "0.3.31"
socket2 = { version = "0.6.3", features = ["all"] }
async-task = "4.7.1"
async-io = "2.6.0"
crossbeam-deque = "0.8.7"
core-scheduler-timers = { path = "../timers", version = "=0.0.0", features = ["sharded"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO"] }

[dev-dependencies]
core-scheduler-conformance = { path = "../conformance", version = "=0.0.0" }
futures-lite = "2.6.1"
tempfile = "3"
allocation-counter = "0.8.1"

[package]
name = "core-scheduler-echo-benchmark"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
core-scheduler = { path = "../.." }
core-scheduler-tokio = { path = "../../crates/tokio" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
serde_json = "1"
hdrhistogram = { version = "7.5", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
core-scheduler-native = { path = "../../crates/native" }
core-scheduler-iouring = { path = "../../crates/iouring" }
monoio = { version = "0.2.4", default-features = false, features = ["async-cancel", "iouring", "legacy"] }

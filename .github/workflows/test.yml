name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, llvm-tools-preview, rustfmt
          cache-shared-key: coverage-bake-launcher-v2
      - name: Install Bake launcher
        run: cargo install bake --locked
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Run workspace tests and require complete source-region coverage
        run: cargo bake --locked test:coverage --all-targets true --all-features true
      - name: Require complete timer coverage without optional features
        run: cargo bake --locked test:coverage --package core-scheduler-timers --all-targets true

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test --locked --workspace --all-features --exclude core-scheduler-bake

  test-result:
    if: always()
    needs: [test, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful tests and coverage
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
